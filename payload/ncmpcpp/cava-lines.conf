[general]
framerate = 60
bars = 30
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 14000
[input]
method = fifo
source = /tmp/mpd.fifo
sample_rate = 44100
sample_bits = 16
[output]
method = raw
raw_target = /dev/stdout
data_format = binary
bit_format = 8bit
channels = mono
mono_option = average
[smoothing]
noise_reduction = 65
monstercat = 0
waves = 0
